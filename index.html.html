<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RTS Tracker">
<title>Recupera tu Salud — Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #0D1117;
  --bg2: #161B22;
  --bg3: #21262D;
  --border: #30363D;
  --text: #E6EDF3;
  --text2: #8B949E;
  --text3: #484F58;
  --green: #3FB950;
  --green-dim: #1A3A22;
  --red: #F85149;
  --red-dim: #3D1A1A;
  --amber: #D29922;
  --amber-dim: #3D2E0A;
  --accent: #58A6FF;
  --radius: 10px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }

/* HEADER */
.header { padding: 14px 16px 0; flex-shrink: 0; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.logo-text { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; color: var(--text2); text-transform: uppercase; }
.upload-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--font); transition: all .15s; }
.upload-btn:hover { border-color: var(--accent); color: var(--accent); }
.upload-btn i { font-size: 14px; }

/* GROUP CHIPS */
.group-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.group-bar::-webkit-scrollbar { display: none; }
.gchip { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; border: 0.5px solid var(--border); font-size: 12px; color: var(--text2); cursor: pointer; background: transparent; font-family: var(--font); transition: all .15s; white-space: nowrap; }
.gchip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
.no-groups { font-size: 12px; color: var(--text3); padding: 4px 0; font-style: italic; }

/* TABS */
.tabs { display: flex; border-bottom: 0.5px solid var(--border); margin-top: 14px; flex-shrink: 0; }
.tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 12px; color: var(--text3); cursor: pointer; border: none; background: none; font-family: var(--font); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tab i { font-size: 15px; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .badge-count { background: var(--red); color: #fff; border-radius: 20px; font-size: 10px; padding: 1px 6px; min-width: 18px; }

/* CONTENT */
.content { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--bg3) transparent; }
.panel { display: none; }
.panel.active { display: block; }

/* EMPTY */
.empty { text-align: center; padding: 4rem 1rem; color: var(--text3); }
.empty i { font-size: 40px; display: block; margin-bottom: 12px; }
.empty p { font-size: 13px; line-height: 1.6; }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.stat { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-n { font-size: 26px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
.stat-l { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

/* ALERT */
.alert { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
.alert-red { background: var(--red-dim); border: 0.5px solid var(--red); }
.alert-green { background: var(--green-dim); border: 0.5px solid var(--green); }
.alert i { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-red i { color: var(--red); }
.alert-green i { color: var(--green); }
.alert-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.alert-red .alert-title { color: var(--red); }
.alert-green .alert-title { color: var(--green); }
.alert-sub { font-size: 11px; color: var(--text2); }

/* INACTIVE LIST */
.inact-list { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.inact-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
.inact-item:last-child { border-bottom: none; }
.inact-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.inact-days { font-size: 11px; color: var(--text2); }
.days-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--red-dim); color: var(--red); font-weight: 500; font-family: var(--mono); white-space: nowrap; }

/* SECTION TITLE */
.section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }

/* COPY BOX */
.copy-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 12px; color: var(--text2); font-family: var(--mono); white-space: pre-wrap; line-height: 1.7; margin-bottom: 10px; max-height: 180px; overflow-y: auto; }
.msg-area { width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: var(--text); font-family: var(--font); resize: vertical; min-height: 90px; line-height: 1.6; margin-bottom: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-family: var(--font); cursor: pointer; border: 0.5px solid var(--border); background: var(--bg3); color: var(--text2); transition: all .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn i { font-size: 14px; }
.btn-success { background: var(--green-dim); border-color: var(--green); color: var(--green); }

/* TABLE */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; border-bottom: 0.5px solid var(--border); background: var(--bg2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg2); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.dot-g { background: var(--green); } .dot-r { background: var(--red); } .dot-a { background: var(--amber); }
.prog { height: 4px; border-radius: 4px; background: var(--bg3); overflow: hidden; min-width: 60px; }
.prog-fill { height: 4px; border-radius: 4px; background: var(--accent); }

/* SEARCH */
.search-input { width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--text); font-family: var(--font); margin-bottom: 10px; transition: border-color .15s; }
.search-input:focus { outline: none; border-color: var(--accent); }
.msg-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.msg-sender { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.msg-body { font-size: 13px; line-height: 1.5; color: var(--text); }
.msg-date { font-size: 11px; color: var(--text3); margin-top: 6px; font-family: var(--mono); }

/* FILTERS */
.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.filters label { font-size: 12px; color: var(--text2); }
.filters select { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--text); font-family: var(--font); cursor: pointer; }

/* DIVIDER */
.divider { height: 0.5px; background: var(--border); margin: 16px 0; }

/* TOAST */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green); color: #000; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; z-index: 100; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* INSTALL BANNER */
.install-banner { background: var(--bg2); border: 0.5px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
.install-banner i { color: var(--accent); font-size: 20px; flex-shrink: 0; }
.install-banner-text { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.5; }
.install-banner-text strong { color: var(--text); display: block; margin-bottom: 2px; }
.install-close { color: var(--text3); cursor: pointer; font-size: 18px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">RTS Tracker</span>
    </div>
    <button class="upload-btn" onclick="document.getElementById('file-in').click()">
      <i class="ti ti-upload"></i> Cargar chat
    </button>
    <input type="file" id="file-in" accept=".txt" multiple style="display:none" onchange="handleFiles(this.files)">
  </div>
  <div class="group-bar" id="group-bar">
    <span class="no-groups">Sin grupos cargados</span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('inactivos')" id="tab-inactivos">
      <i class="ti ti-user-off"></i> Inactivos
      <span class="badge-count" id="badge-inactivos" style="display:none"></span>
    </button>
    <button class="tab" onclick="switchTab('todos')" id="tab-todos">
      <i class="ti ti-users"></i> Todos
    </button>
    <button class="tab" onclick="switchTab('buscar')" id="tab-buscar">
      <i class="ti ti-search"></i> Buscar
    </button>
  </div>
</div>

<div class="content">

  <!-- INACTIVOS -->
  <div class="panel active" id="panel-inactivos">
    <div id="inactivos-inner">
      <div class="empty">
        <i class="ti ti-upload"></i>
        <p>Carga un archivo .txt exportado<br>desde WhatsApp para comenzar</p>
      </div>
    </div>
  </div>

  <!-- TODOS -->
  <div class="panel" id="panel-todos">
    <div id="todos-inner">
      <div class="empty"><i class="ti ti-file-upload"></i><p>Carga un grupo primero</p></div>
    </div>
  </div>

  <!-- BUSCAR -->
  <div class="panel" id="panel-buscar">
    <div id="buscar-inner">
      <div class="empty"><i class="ti ti-file-upload"></i><p>Carga un grupo primero</p></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const S = { groups: [], active: null };

// ── PARSE ──────────────────────────────────────────────────────────────
function parseChat(filename, text) {
  const lines = text.split('\n');
  const msgs = [], nameMap = {};
  const re = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2}(?:[:\d]*)?(?:\s*[ap]\.\s*m\.)?)\s*[-–]\s+([^:]+):\s+(.+)$/i;
  const sysRe = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2})/;
  let last = null;
  lines.forEach(line => {
    const c = line.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
    if (!c) return;
    const m = c.match(re);
    if (m) {
      const [,date,time,sender,body] = m;
      const s = sender.trim();
      const isMedia = /multimedia omitido|image omitted|video omitted|audio omitted|sticker omitted/i.test(body);
      last = { date, time, sender: s, body: body.trim(), isMedia };
      msgs.push(last);
      nameMap[s] = (nameMap[s]||0) + 1;
    } else if (sysRe.test(c)) {
      last = null;
    } else if (last && c) {
      last.body += ' ' + c;
    }
  });
  const name = filename
    .replace(/^chat de whatsapp con /i,'')
    .replace(/^whatsapp chat with /i,'')
    .replace(/\.txt$/i,'').trim();
  const idx = S.groups.findIndex(g => g.filename === filename);
  const g = { filename, name, messages: msgs, memberCount: Object.keys(nameMap).length, msgCount: msgs.length, nameMap };
  if (idx >= 0) S.groups[idx] = g; else S.groups.push(g);
  if (!S.active) S.active = name;
  renderGroupBar();
  renderActive();
}

function handleFiles(files) {
  Array.from(files).forEach(f => {
    if (!f.name.endsWith('.txt')) return;
    const r = new FileReader();
    r.onload = e => parseChat(f.name, e.target.result);
    r.readAsText(f, 'utf-8');
  });
}

// Drop support on content area
document.querySelector('.content').addEventListener('dragover', e => e.preventDefault());
document.querySelector('.content').addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

// ── UTILS ──────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str) return new Date(0);
  const p = str.split('/');
  if (p.length !== 3) return new Date(0);
  let [d,mo,y] = p;
  if (y.length === 2) y = '20' + y;
  return new Date(+y, +mo-1, +d);
}
function latestDate(msgs) {
  const dates = msgs.map(m => parseDate(m.date)).filter(d => d > new Date(0));
  return dates.length ? new Date(Math.max(...dates)) : new Date();
}
function daysSince(dateStr, ref) {
  const diff = ref - parseDate(dateStr);
  return Math.floor(diff / 86400000);
}
function lastActivity(name, msgs, ref) {
  const personal = msgs.filter(m => m.sender === name);
  if (!personal.length) return null;
  const dates = personal.map(m => parseDate(m.date)).filter(d => d > new Date(0));
  if (!dates.length) return null;
  return Math.floor((ref - new Date(Math.max(...dates))) / 86400000);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function copyEl(el) {
  const txt = el.tagName === 'TEXTAREA' ? el.value : (el.innerText || el.textContent);
  navigator.clipboard.writeText(txt).then(() => toast('¡Copiado!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); toast('¡Copiado!');
  });
}

// ── GROUP BAR ──────────────────────────────────────────────────────────
function renderGroupBar() {
  const bar = document.getElementById('group-bar');
  if (!S.groups.length) { bar.innerHTML = '<span class="no-groups">Sin grupos cargados</span>'; return; }
  bar.innerHTML = S.groups.map(g =>
    `<button class="gchip ${g.name===S.active?'active':''}" onclick="selectGroup('${g.name.replace(/'/g,"\\'")}')">
      ${g.name} <span style="opacity:.5;font-size:10px">${g.memberCount}</span>
    </button>`
  ).join('');
}
function selectGroup(name) {
  S.active = name;
  renderGroupBar();
  renderActive();
}

// ── TABS ───────────────────────────────────────────────────────────────
let currentTab = 'inactivos';
function switchTab(name) {
  currentTab = name;
  ['inactivos','todos','buscar'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('panel-'+t).classList.toggle('active', t===name);
  });
  renderActive();
}
function renderActive() {
  if (currentTab==='inactivos') renderInactivos();
  else if (currentTab==='todos') renderTodos();
  else renderBuscar();
}

// ── INACTIVOS ──────────────────────────────────────────────────────────
function renderInactivos() {
  const el = document.getElementById('inactivos-inner');
  if (!S.groups.length) { el.innerHTML = '<div class="empty"><i class="ti ti-upload"></i><p>Carga un archivo .txt exportado<br>desde WhatsApp para comenzar</p></div>'; return; }
  const g = S.groups.find(x => x.name===S.active) || S.groups[0];
  const ref = latestDate(g.messages);
  const all = Object.keys(g.nameMap);
  const inact = all
    .map(n => ({ name: n, days: lastActivity(n, g.messages, ref) ?? 999 }))
    .filter(x => x.days >= 3)
    .sort((a,b) => b.days - a.days);
  const activeCount = all.length - inact.length;
  const pct = all.length ? Math.round(activeCount/all.length*100) : 0;

  // update badge
  const badge = document.getElementById('badge-inactivos');
  if (inact.length) { badge.textContent = inact.length; badge.style.display=''; }
  else badge.style.display='none';

  const listText = inact.map(x => x.name).join('\n');
  const msgWarn = `Hola, notamos que llevas 3+ días sin participar en el grupo 🌿

Recuerda que la participación diaria (fotos de comidas o respuestas a las actividades) es parte del compromiso del programa Recupera tu Salud.

Si no hay actividad, lamentablemente tendremos que retirar tu acceso. ¡Aún estás a tiempo! 💪`;

  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-n">${all.length}</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)">${activeCount}</div><div class="stat-l">Activos</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${inact.length}</div><div class="stat-l">Inactivos 3d+</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--accent)">${pct}%</div><div class="stat-l">Participación</div></div>
    </div>

    ${inact.length ? `
    <div class="alert alert-red">
      <i class="ti ti-alert-triangle"></i>
      <div><div class="alert-title">${inact.length} miembro(s) sin actividad en 3+ días</div>
      <div class="alert-sub">Referencia: último mensaje del grupo · ${ref.toLocaleDateString('es-MX')}</div></div>
    </div>
    <div class="section-title">Lista de inactivos</div>
    <div class="inact-list">${inact.map(x=>`
      <div class="inact-item">
        <div>
          <div class="inact-name">${x.name}</div>
          <div class="inact-days">Último mensaje hace ${x.days===999?'nunca':x.days+' día(s)'}</div>
        </div>
        <span class="days-pill">${x.days===999?'nunca':x.days+'d'}</span>
      </div>`).join('')}
    </div>
    <div class="section-title">Copiar nombres para eliminar</div>
    <div class="copy-box" id="copy-names">${listText}</div>
    <div class="btn-row">
      <button class="btn" onclick="copyEl(document.getElementById('copy-names'))"><i class="ti ti-copy"></i> Copiar lista</button>
    </div>
    <div class="section-title">Mensaje de advertencia</div>
    <textarea class="msg-area" id="msg-warn">${msgWarn}</textarea>
    <div class="btn-row">
      <button class="btn" onclick="copyEl(document.getElementById('msg-warn'))"><i class="ti ti-message"></i> Copiar mensaje</button>
    </div>
    ` : `
    <div class="alert alert-green">
      <i class="ti ti-circle-check"></i>
      <div><div class="alert-title">¡Todos activos!</div>
      <div class="alert-sub">Ningún miembro lleva 3+ días sin participar en ${g.name}</div></div>
    </div>
    `}
  `;
}

// ── TODOS ──────────────────────────────────────────────────────────────
function renderTodos() {
  const el = document.getElementById('todos-inner');
  if (!S.groups.length) { el.innerHTML = '<div class="empty"><i class="ti ti-file-upload"></i><p>Carga un grupo primero</p></div>'; return; }
  el.innerHTML = `
    <div class="filters">
      <label>Últimos</label>
      <select id="days-f" onchange="updateTodos()">
        <option value="3">3 días</option><option value="7" selected>7 días</option>
        <option value="14">14 días</option><option value="28">28 días</option><option value="84">84 días</option>
      </select>
      <label>Ver</label>
      <select id="show-f" onchange="updateTodos()">
        <option value="all">Todos</option><option value="active">Activos</option><option value="inactive">Inactivos</option>
      </select>
    </div>
    <div id="todos-table"></div>
  `;
  updateTodos();
}
function updateTodos() {
  const g = S.groups.find(x => x.name===S.active) || S.groups[0];
  if (!g) return;
  const days = parseInt(document.getElementById('days-f')?.value||'7');
  const show = document.getElementById('show-f')?.value||'all';
  const ref = latestDate(g.messages);
  const cutoff = new Date(ref); cutoff.setDate(cutoff.getDate()-days);
  const filtered = g.messages.filter(m => parseDate(m.date) >= cutoff);
  const activeSet = new Set(filtered.map(m => m.sender));
  const all = Object.keys(g.nameMap);
  let rows = all.map(n => {
    const isActive = activeSet.has(n);
    return { name: n, msgs: filtered.filter(m=>m.sender===n).length, active: isActive, daysAgo: lastActivity(n,g.messages,ref) };
  }).filter(r => show==='all'||(show==='active'&&r.active)||(show==='inactive'&&!r.active));
  rows.sort((a,b)=>b.msgs-a.msgs);
  const maxMsgs = rows[0]?.msgs||1;
  const wrap = document.getElementById('todos-table');
  if (!wrap) return;
  const activeCount = rows.filter(r=>r.active).length;
  const pct = all.length ? Math.round(activeCount/all.length*100) : 0;
  wrap.innerHTML = `
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><div class="stat-n">${all.length}</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)">${rows.filter(r=>r.active).length}</div><div class="stat-l">Activos</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--red)">${rows.filter(r=>!r.active).length}</div><div class="stat-l">Inactivos</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--accent)">${pct}%</div><div class="stat-l">Participación</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Participante</th><th>Estado</th><th>Último msg</th><th>Actividad</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td style="font-family:var(--mono);font-size:11px">${r.name}</td>
        <td><span class="dot ${r.active?(r.daysAgo>=3?'dot-a':'dot-g'):'dot-r'}"></span>${r.active?'Activo':'Inactivo'}</td>
        <td style="color:var(--text2);font-size:11px">${r.daysAgo===null?'Nunca':r.daysAgo===0?'Hoy':r.daysAgo===1?'Ayer':r.daysAgo+'d atrás'}</td>
        <td><div class="prog"><div class="prog-fill" style="width:${r.msgs?Math.round(r.msgs/maxMsgs*100):0}%"></div></div></td>
      </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

// ── BUSCAR ─────────────────────────────────────────────────────────────
function renderBuscar() {
  const el = document.getElementById('buscar-inner');
  if (!S.groups.length) { el.innerHTML = '<div class="empty"><i class="ti ti-file-upload"></i><p>Carga un grupo primero</p></div>'; return; }
  el.innerHTML = `
    <input class="search-input" type="text" id="s-name" placeholder="🔍 Nombre o número..." oninput="doSearch()" autocomplete="off">
    <input class="search-input" type="text" id="s-kw" placeholder="💬 Palabra clave en el mensaje..." oninput="doSearch()" autocomplete="off">
    <div id="s-res"><p style="font-size:12px;color:var(--text3)">Escribe para buscar mensajes...</p></div>
  `;
}
function doSearch() {
  const g = S.groups.find(x => x.name===S.active) || S.groups[0];
  if (!g) return;
  const name = (document.getElementById('s-name')?.value||'').toLowerCase().trim();
  const kw = (document.getElementById('s-kw')?.value||'').toLowerCase().trim();
  if (!name && !kw) { document.getElementById('s-res').innerHTML='<p style="font-size:12px;color:var(--text3)">Escribe para buscar mensajes...</p>'; return; }
  let res = g.messages;
  if (name) res = res.filter(m => m.sender.toLowerCase().includes(name));
  if (kw) res = res.filter(m => m.body.toLowerCase().includes(kw));
  const wrap = document.getElementById('s-res');
  if (!res.length) { wrap.innerHTML='<div class="empty" style="padding:2rem"><i class="ti ti-mood-sad"></i><p>Sin resultados</p></div>'; return; }
  const shown = res.slice(-60).reverse();
  wrap.innerHTML = `<p style="font-size:11px;color:var(--text3);margin-bottom:10px">${res.length} resultado(s)</p>`
    + shown.map(m=>`<div class="msg-card">
      <div class="msg-sender">${m.sender}</div>
      <div class="msg-body">${m.isMedia?'📷 '+m.body:m.body}</div>
      <div class="msg-date">${m.date} · ${m.time}</div>
    </div>`).join('');
}

// ── PWA / INSTALL ──────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});
function showInstallBanner() {
  // Only show in inactivos panel when no groups loaded
  const el = document.getElementById('inactivos-inner');
  if (!S.groups.length && el) {
    el.innerHTML = `
      <div class="install-banner">
        <i class="ti ti-device-mobile"></i>
        <div class="install-banner-text">
          <strong>Instalar como app</strong>
          Agrega RTS Tracker a tu pantalla de inicio para acceso rápido sin navegador.
        </div>
        <button class="btn btn-success" onclick="installApp()" style="padding:6px 14px;flex-shrink:0">Instalar</button>
      </div>
      <div class="empty">
        <i class="ti ti-upload"></i>
        <p>Carga un archivo .txt exportado<br>desde WhatsApp para comenzar</p>
      </div>
    `;
  }
}
function installApp() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; }); }
}
</script>

<!-- SERVICE WORKER -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'rts-tracker-v1';
const ASSETS = ['./', './index.html'];
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
